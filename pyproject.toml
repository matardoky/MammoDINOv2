[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr"
version = "0.1.0"
description = "Production-grade RF-DETR mammography lesion detection pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "RF-DETR Team"}
]
keywords = ["deep-learning", "mammography", "object-detection", "dinov2", "detrex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm==1.0.29",
    "numpy",
    "opencv-python",
    "scipy",
    "pycocotools",
    "matplotlib>=3.5.0",
    "tensorboard",
    "tensorboardX",
    "fairscale",
    "einops",
    "omegaconf>=2.3.0",
    "fvcore",
    "iopath"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov"
]

[project.scripts]
rfdetr-train = "train:main"
rfdetr-eval = "eval:main"
rfdetr-overfit = "overfit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rfdetr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*torch\\.cuda\\.amp\\.custom_.*:FutureWarning",
    "ignore:.*timm\\.models\\.layers.*:FutureWarning",
    "ignore:.*pkg_resources is deprecated.*:UserWarning",
    "ignore:.*detectron2\\.layers\\.dcn_v3.*:FutureWarning",
    "ignore::FutureWarning:detrex.*",
]
